name: at_server_spec
description: A Dart library containing abstract classes that defines what implementations of the root and secondary servers are responsible for.
version: 5.3.0
repository: https://github.com/atsign-foundation/at_server
homepage: https://docs.atsign.com
documentation: https://docs.atsign.com/atplatform/secondaryserver

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  meta: ^1.11.0
  at_commons: ^5.17.0

# NOTE VerbSyntax.notifyMulti is not in a published at_commons yet.
dependency_overrides:
  at_commons:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk
      ref: 599661fd7be5c8ede552faf450ff2b38b3e464cc
      path: packages/at_commons

dev_dependencies:
  lints: ^5.0.0
