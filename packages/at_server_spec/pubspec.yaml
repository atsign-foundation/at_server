name: at_server_spec
description: A Dart library containing abstract classes that defines what implementations of the root and secondary servers are responsible for.
version: 5.3.0
repository: https://github.com/atsign-foundation/at_server
homepage: https://docs.atsign.com
documentation: https://docs.atsign.com/atplatform/secondaryserver

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  meta: ^1.11.0
  at_commons: ^5.19.0

dev_dependencies:
  lints: ^5.0.0

dependency_overrides:
  # The gate's grammar is not in a published at_commons yet. This must be
  # replaced by the published version before the gate merges.
  at_commons:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      path: packages/at_commons
      ref: bbcc8b60e53aae2290a9dac838886ac0c76460a8
