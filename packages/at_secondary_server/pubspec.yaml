name: at_secondary
description: Implementation of secondary server.
version: 3.16.4
repository: https://github.com/atsign-foundation/at_server
homepage: https://www.example.com
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  args: ^2.7.0
  uuid: ^4.6.0
  convert: ^3.1.2
  cron: ^0.5.1
  crypto: ^3.0.7
  crypton: ^2.2.1
  collection: ^1.19.1
  basic_utils: ^5.7.0
  ecdsa: ^0.1.2
  encrypt: ^5.0.3
  at_commons: ^5.15.0
  at_utils: ^3.4.0
  at_chops: ^3.5.0
  at_lookup: ^3.6.0
  at_server_spec: ^5.1.0
  at_persistence_secondary_server: ^5.3.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  version: ^3.0.2
  meta: ^1.19.0
  mutex: ^3.1.0
  yaml: ^3.1.3
  logging: ^1.3.0
  mime: ^2.0.0
  at_base2e15: ^1.0.0

dependency_overrides:
  at_chops:
    git:
      url: https://github.com/atsign-foundation/at_libraries.git
      path: packages/at_chops
      ref: at_chops_faster_aes

dev_dependencies:
  build_runner: ^2.15.2
  test: ^1.31.2
  coverage: ^1.15.1
  lints: ^6.1.0
  mocktail: ^1.0.5
  # Generating an secp256r1 keypair to sign an ecc_secp256r1 APKAM signature
  # with, in apkam_signature_verifier_test. Declared rather than leaned on
  # transitively through ecdsa, matching tests/at_functional_test.
  elliptic: ^0.3.11

dependency_overrides:
  at_persistence_secondary_server:
    path: ../at_persistence_secondary_server
  # Without this, `dart pub get` resolves at_server_spec from pub.dev instead
  # of the sibling in this repo, so a build silently compiles against a
  # different version of the spec than the tree it was built from. It resolves
  # rather than failing because the constraint above is satisfiable by a
  # published version, so nothing goes red.
  #
  # The melos-generated pubspec_overrides.yaml pins this too, but that file is
  # gitignored, so it protects only a working tree that has been bootstrapped —
  # not CI, and not the image builds under tools/build_secondary, which run a
  # bare `dart pub get` in a clean checkout.
  #
  # Adding a path override here requires ../at_server_spec to exist wherever
  # pub runs: every Dockerfile that compiles this package must COPY it in.
  at_server_spec:
    path: ../at_server_spec
