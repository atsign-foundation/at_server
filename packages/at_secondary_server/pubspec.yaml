name: at_secondary
description: Implementation of secondary server.
version: 3.15.0
repository: https://github.com/atsign-foundation/at_server
homepage: https://www.example.com
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  args: ^2.7.0
  uuid: ^4.5.3
  convert: ^3.1.2
  cron: ^0.5.1
  crypto: ^3.0.7
  crypton: ^2.2.1
  collection: ^1.19.1
  basic_utils: ^5.7.0
  ecdsa: ^0.1.2
  encrypt: ^5.0.3
  at_commons: ^5.12.0
  at_utils: ^3.4.0
  at_chops: ^3.4.0
  at_lookup: ^3.5.0
  at_server_spec: ^5.1.0
  at_persistence_secondary_server: ^5.2.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  version: ^3.0.2
  meta: ^1.18.3
  mutex: ^3.1.0
  yaml: ^3.1.3
  logging: ^1.3.0
  mime: ^2.0.0
  at_base2e15: ^1.0.0

dev_dependencies:
  build_runner: ^2.15.0
  test: ^1.31.2
  coverage: ^1.15.1
  lints: ^6.1.0
  mocktail: ^1.0.5

dependency_overrides:
  at_chops:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      # PR #2030 (at_chops FFI / AtPqc) has merged to trunk, so st/at_chops_ffi
      # is gone. Pinned to a commit, not the branch name — floating on trunk
      # makes builds non-reproducible as it moves underneath us.
      ref: 3a9302edda6df9a8f25c62edce8442ef34e590e7
      path: packages/at_chops
  pointycastle: ^4.0.0
  at_persistence_secondary_server:
    path: ../at_persistence_secondary_server
