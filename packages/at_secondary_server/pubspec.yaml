name: at_secondary
description: Implementation of secondary server.
version: 3.15.2
repository: https://github.com/atsign-foundation/at_server
homepage: https://www.example.com
publish_to: none

environment:
  # 3.6.0 floor is set by at_chops ^3.4.2, which declares sdk ^3.6.0 for its
  # FFI/AtPqc support. A lower floor here would not resolve on a 3.5.x SDK.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  args: ^2.7.0
  uuid: ^4.6.0
  convert: ^3.1.2
  cron: ^0.5.1
  crypto: ^3.0.7
  crypton: ^2.2.1
  collection: ^1.19.1
  basic_utils: ^5.7.0
  ecdsa: ^0.1.2
  encrypt: ^5.0.3
  at_commons: ^5.13.0
  at_utils: ^3.4.0
  at_chops: ^3.4.2
  at_lookup: ^3.6.0
  at_server_spec: ^5.1.0
  at_persistence_secondary_server: ^5.2.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  version: ^3.0.2
  meta: ^1.19.0
  mutex: ^3.1.0
  yaml: ^3.1.3
  logging: ^1.3.0
  mime: ^2.0.0
  at_base2e15: ^1.0.0

dev_dependencies:
  build_runner: ^2.15.2
  test: ^1.31.2
  coverage: ^1.15.1
  lints: ^6.1.0
  mocktail: ^1.0.5

dependency_overrides:
  at_persistence_secondary_server:
    path: ../at_persistence_secondary_server
  # TEMPORARY — MUST be removed before merge (see PR description / plan §6).
  # at_chops 3.4.2 fixes the ML-DSA-65 wrong-length-key handling this PR depends
  # on (AtSigningException instead of silent truncation of an over-long secret
  # key) but is not yet published to pub.dev. Drop this override once it is —
  # dropping it without a publish would silently resolve back to the
  # unvalidated 3.4.1 on pub.dev.
  at_chops:
    path: ../../../at_client_sdk/packages/at_chops
