# The atProtocol secondary server configurations.

# The atProtocol atDirectory (aka root server) configuration
root_server:
  # The atDirectory's port
  port: 64
  # The atDirectory's host
  url: 'root.atsign.org'

# Default logger settings
log:
  level: INFO

# The atProtocol security configurations.
security:
  # Files for the certificate presented to clients when they connect
  # These files must exist
  certificateChainLocation: 'certs/fullchain.pem'
  privateKeyLocation: 'certs/privkey.pem'

  # Files for the certificate we present to other atServers when we connect
  # If not present, we present the same cert as we present to clients
  certificateChainLocationMtls: 'certs/mtls/fullchain.pem'
  privateKeyLocationMtls: 'certs/mtls/privkey.pem'

  # File containing the list of root CA certs we should trust when another
  # atServer connects to us
  trustedCertificateLocation: '/etc/cacert/cacert.pem'

  # Whether to require a client certificate when another atServer
  # connects to us. This should NEVER be set to false except in
  # very specific circumstances, such as a self-contained ephemeral
  # environment, or for testing purposes. This flag also controls
  # whether we present a client certificate when connecting to another
  # atServer
  clientCertificateRequired: true

# Persistence backend selection.
# - backend: 'hive' (default) keeps the historical Hive stores; 'sqlite'
#   opens one atsign.db per atSign under <storageRoot>/sqlite.
# - storageRoot: the common root for the backend marker (.persistence_backend)
#   and, for the 'sqlite'/'dual' backends, the SQLite data (<storageRoot>/sqlite).
#   IMPORTANT: with the default 'hive' backend, storageRoot ONLY locates the
#   marker file — the Hive data paths come from the 'hive:' section below, NOT
#   from here. The two are independent: changing storageRoot does not move Hive
#   data, and on a legacy Hive-only install the marker file is never even
#   written (it is created only when 'backend' changes). storageRoot becomes the
#   actual data root only under the 'sqlite'/'dual' backends.
#
# Production note: these are RELATIVE paths. The secondary container runs with
# working directory /atsign (tools/build_secondary/Dockerfile: WORKDIR /atsign),
# so 'storage' resolves to /atsign/storage — the mount point of the persistent
# volume that holds atServer state across container restarts. The volume is
# supplied by the deploy layer (docker `-v` / k8s PVC); the image only
# pre-creates the /atsign/storage directory. Keep every storage path (this one
# and the 'hive:' paths) under the same root so all state lands on that one
# mounted volume.
#
# Changing 'backend' triggers a migrate-verify-flip at startup (aborting
# startup on any failure, leaving the source data untouched). The old
# backend's data is RETAINED after a successful migration; reclaim it with
# bin/cleanup_stale_persistence.dart once you no longer need to roll back.
persistence:
  backend: 'hive'
  storageRoot: 'storage'

# Cross-server 'to:' verb: the first verb on an outbound peer connection
# declares the target tenant, giving architectural flexibility for atServer
# endpoints — e.g. atServers reached through proxies / gateways.
# Understanding inbound 'to:@x' is always on (unauthenticated, serves only
# data already publicly readable via lookup). Emitting 'to:@target' on
# outbound peer connections is gated here:
# - toVerbOutboundEnabled (default false): emit 'to:@target' as the first
#   verb on outbound peer connections. A peer that rejects 'to:' triggers a
#   fallback to the legacy lookup, so enabling early costs a wasted round
#   trip per connection to legacy peers, not an outage. Turn on (env
#   toVerbOutboundEnabled=true) once the fleet understands 'to:'.
protocol:
  toVerbOutboundEnabled: false

# Hive storage paths — used when persistence.backend is 'hive' (the default).
# These are INDEPENDENT of persistence.storageRoot above: the backend marker
# lives at <storageRoot>/.persistence_backend, but the Hive data itself lives at
# exactly the paths below. They default under the same 'storage/' root that is
# mounted into the container in production (see the 'persistence:' section
# above), so all atServer state lands on the one persistent volume — keep them
# consistent with storageRoot if you relocate it.
hive:
  # The storage path for secondary storage.
  storagePath: 'storage/hive'
  # The storage path for commit log.
  commitLogPath: 'storage/commitLog'
  # The storage path for access log.
  accessLogPath: 'storage/accessLog'
  # The storage path for notifications
  notificationStoragePath: 'storage/notificationLog.v1'
  # The frequent time interval(in minutes) to run job which removes the expired keys from secondary storage.
  expiringRunFrequencyMins: 12
  # List of malformed keys that will be deleted on server startup
  malformedKeys: 'public:publickey'
  # Delete keys that start with "public:cached" on server startup
  # This is set to true by default. To retain the malformed keys on server start-up,
  # set the flag to false.
  shouldRemoveMalformedKeys: true
  # The keys added to the following list will be considered as protectedKeys and will be forbidden from deletion
  # Any key that contains the 'atSign' should be formatted as key<@atsign>. <@atsign> will be replaced with the actual atsign during runtime
  protectedKeys: []

# The atProtocol connection configurations.
connection:
  # At any point, at most [inbound_max_limit] inbound connections are allowed. The inbound connection
  # pool takes care of ensuring that idle connections are closed as necessary
  inbound_max_limit: 200

  # The maximum idle time in milliseconds for an **unauthenticated** inbound connection.
  # Connections which have been idle for longer than this will be closed.
  # Default value is 10 minutes (10 * 60 * 1000 == 600000)
  # Internally, the effective value used is reduced progressively towards 5 seconds as the current
  # number of connections approaches the inbound_max_limit.
  inbound_idle_time_millis: 600000

  # The maximum idle time in milliseconds for an **unauthenticated** outbound connection.
  # Connections which have been idle for longer than this will be closed.
  # Default value is 9 minutes 59 seconds (1 second less than inbound_idle_time_millis)
  outbound_idle_time_millis: 599000

  # The maximum idle time in milliseconds for an **authenticated** inbound connection.
  # Connections which have been idle for longer than this will be closed.
  # Default value is 10 minutes (10 * 60 * 1000 == 600000)
  authenticated_inbound_idle_time_millis: 600000

  # The maximum idle time in milliseconds for an **authenticated** outbound connection.
  # Connections which have been idle for longer than this will be closed.
  # Default value is 9 minutes 59 seconds (1 second less than authenticated_inbound_idletime_millis)
  authenticated_outbound_idle_time_millis: 599000

  # At any point, at most [outbound_max_limit] outbound connections are allowed.
  outbound_max_limit: 200

# The atProtocol commit log compaction job configurations.
commit_log_compaction:
  # The frequent time interval (in minutes) to initiate the commit log compaction job service.
  compactionFrequencyMins: 18
  # The percentage of logs to remove through the commit log compaction job service.
  compactionPercentage: 20
  # The size of the log persistent storage (in KiloBytes) when reached, initiates the commit log compaction job service.
  sizeInKB: 10

# The atProtocol access log compaction job configurations.
access_log_compaction:
  # The frequent time interval (in minutes) to initiate the access log compaction job service.
  compactionFrequencyMins: 15
  # The percentage of logs to remove through the access log compaction job service.
  compactionPercentage: 30
  # The size of the log persistent storage (in KiloBytes) when reached, initiates the access log compaction job service.
  sizeInKB: 2

# The atProtocol notification keystore compaction job configurations.
notification_keystore_compaction:
  compactionFrequencyMins: 5
  compactionPercentage: 30
  sizeInKB: -1

# The atProtocol key lookup configurations.
lookup:
  # The number of iterations to resolve the atSign value references.
  depth_of_resolution: 3

# The configurations for atProtocol statistics
stats:
  # Return the other atSign users who visited the current atSign for maximum number of times in the descending order.
  top_visits: 5
  # Return the keys of current atSign's looked up by the other atSign users for maximum number of times in the descending order.
  top_keys: 5

notification:
  autoNotify: true
  # The time interval(in seconds) to notify latest commitID to monitor connections
  # To disable to the feature, set to -1.
  statsNotificationJobTimeInterval: 15
  # The amount of time after which a notification expires in units of minutes
  expiryInMins: 15

# At refresh Job to refresh the cached keys.
refreshJob:
  # Hour at which the job has to run. Currently runs at 3 A.M. every day.
  runJobHour: 3

certificate_expiry:
  # Force restart secondary server.
  force_restart: false

# Sync Configurations
sync:
  # Represents the size of buffer for each batch.
  bufferSize: 5242880
  # Represents the numbers of keys to send in each batch.
  pageLimit: 25

#set to true in testing mode, false by default
#IMPORTANT NOTE : please set testingMode to true only if you know what you're doing. Set to false when not testing
testing:
  testingMode: false

# PQ (post-quantum) X-Wing cert configurations
pq:
  # The number of days after issuance that a PQ X-Wing certificate expires and
  # must be rotated. Default value is 90 days (3 months).
  xwingCertExpiryInDays: 90
  # How many days before expiry the server renews (rotates) its own X-Wing
  # cert. Default value is 30 days. Has no effect on peer-cert verification,
  # which stays strict.
  xwingCertRenewalHeadroomDays: 30
  # When true, the FROM verb handler skips PQ cert lookup and always issues a
  # UUID/RSA challenge. Default value is false.
  disablePqAuth: false

# APKAM enrollment configurations
enrollment:
  # The maximum time in hours for an enrollment to expire, beyond which any action on enrollment is forbidden.
  # Default values is 48 hours.
  expiryInHours: 48
  # The maximum number of requests allowed within the time window.
  maxRequestsPerTimeFrame: 5
  # The duration of the time window in hours.
  timeFrameInHours: 1
  # The threshold value for the delay interval in seconds.
  # If the duration between the last received invalid OTP and the current date-time
  # exceeds the delayIntervalThreshold, trigger a reset to the default value.
  delayIntervalThreshold: 55