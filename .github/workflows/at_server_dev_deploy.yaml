name: at_root deploy (dev)
on:
  push:
    branches:
      - trunk
    paths:
      - packages/*_root_server/**

permissions:  # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  Docker_Build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for creating OIDC tokens for signing.
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      # Extract branch for docker tag
      - name: Get branch name
        run: echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to DockerHub
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          tags: |
            type=raw,value=dev_env
            type=raw,value=dev_env-gha${{ github.run_number }}
            type=raw,value=dev_env-${{ env.BRANCH }}-gha${{ github.run_number }}
          images: |
            atsigncompany/root
          labels: |
            org.opencontainers.image.description=atDirectory dev image

      # Build the Docker image for Dev
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          file: packages/at_root_server/Dockerfile
          context: packages/at_root_server
          push: true
          sbom: true
          provenance: version=v1,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign the images with GitHub OIDC Token
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}

  Deploy_On_Dev_K8:
      needs: Docker_Build
      runs-on: [self-hosted, linux, x64, K8s]
      steps:
        - name: Checkout
          uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        # Extract branch for docker tag
        - name: Get branch name
          run: echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV

        # Setup gcloud CLI
        - id: 'auth'
          uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
          with:
            credentials_json: '${{ secrets.GKE_SA_DEV_KEY }}'

        - name: 'Set up Cloud SDK'
          uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

        # Get the GKE credentials so we can deploy to the cluster
        - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
          with:
            cluster_name: ${{ secrets.GKE_DEV_CLUSTER }}
            location: ${{ secrets.GKE_DEV_ZONE }}

      # Deploy the Docker image to the GKE cluster 
        - name: Deploy
          run: |-
            kubectl -n root set image deployment/root root=atsigncompany/root:dev_env-gha${{ github.run_number }}
            kubectl rollout restart deployment root -n root
