version: 2
enable-beta-ecosystems: true
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directories:
      - "/tools/build_ephemeral_environment/ee_base"
      - "/tools/build_secondary"
      - "/tools/build_virtual_environment/ve"
      - "/tools/build_virtual_environment/ve_base"
      - "/packages/at_root_server"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: "pub"
    directories:
      - "/packages/at_root_server"
      - "/packages/at_secondary_server"
      - "/tools/build_ephemeral_environment/at_activate"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      pub:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/tools" # Location of package manifests
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns:
          - "*"
