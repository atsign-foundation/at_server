name: at_functional_test
description: functional tests for AtServer
version: 1.0.0
publish_to: none

environment:
  sdk: '>=2.15.0 <4.0.0'

dependencies:
  hex: ^0.2.0
  at_demo_data: ^1.1.0
  at_chops: ^2.2.0
  at_lookup: ^3.0.49
  at_commons: ^5.1.2
  uuid: ^3.0.7
  elliptic: ^0.3.8

dependency_overrides:
  at_chops:
    git:
      url: https://github.com/atsign-foundation/at_libraries.git
      path: packages/at_chops
      ref: at_chops_faster_aes

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.9
  version: ^3.0.2
