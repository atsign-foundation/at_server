name: at_functional_test
description: functional tests for AtServer
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.6.0'

dependency_overrides:
  at_persistence_secondary_server:
    path: ../../packages/at_persistence_secondary_server
  # appMetadata support (Metadata.appMetadata, AtConstants.appMetadata)
  # is on the xl-pluggable branch; not yet published to pub.dev.
  at_commons:
    git:
      url: https://github.com/atsign-foundation/at_client_sdk.git
      ref: xl-pluggable
      path: packages/at_commons
dependencies:
  hex: ^0.2.0
  at_persistence_secondary_server: ^4.3.5
  at_demo_data: ^1.2.0
  at_chops: ^2.2.0
  at_lookup: ^3.3.0
  at_commons: ^5.5.0
  at_utils: ^3.3.0
  uuid: ^4.5.1
  yaml: ^3.1.3
  crypton: ^2.2.1
  crypto: ^3.0.6
  encrypt: ^5.0.3
  elliptic: ^0.3.11


dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
  http: ^1.5.0
  version: ^3.0.2
